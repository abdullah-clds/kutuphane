name: Deploy Vite App (frontend) to GitHub Pages

on:
  push:
    branches:
      - main  # Trigger deploy when code pushed to main branch
  workflow_dispatch:

permissions:
  contents: write  # allow deployment

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend  # Run all commands inside frontend folder

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Project
        # The site is served from https://<user>.github.io/<repo>/
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist  # built folder inside frontend
